[package]
name = "life-cal-worker"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
miniz_oxide = "0.8"
crc32fast = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "=0.8.7"
js-sys = "0.3"
serde_json = "1"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
