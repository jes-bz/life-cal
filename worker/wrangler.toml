name = "life-cal-worker"
# Retired: retained for local renderer tests only.
workers_dev = false
preview_urls = false
main = "build/worker/shim.mjs"
compatibility_date = "2024-01-17"

[build]
command = "worker-build --release"
watch_dir = "src"

[cache]
enabled = true

[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true
head_sampling_rate = 1.0

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[dev]
port = 8787
