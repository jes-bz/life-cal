name = "life-cal-worker"
main = "../worker-rust/build/worker/shim.mjs"
compatibility_date = "2024-01-17"

[build]
command = "worker-build --release"
cwd = "../worker-rust"
watch_dir = "../worker-rust/src"

[cache]
enabled = true

[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true
head_sampling_rate = 1.0

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[[routes]]
pattern = "life-cal.jes.bz"
custom_domain = true

[dev]
port = 8787
