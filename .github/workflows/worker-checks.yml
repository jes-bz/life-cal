name: Check Rust Worker
on:
  push:
    branches: [main]
    paths: ['worker/**', 'worker-rust/**', 'shared/**', '.github/workflows/worker-checks.yml']
  pull_request:
    paths: ['worker/**', 'worker-rust/**', 'shared/**', '.github/workflows/worker-checks.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
      - run: cargo install worker-build --version 0.8.7 --locked
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: worker
